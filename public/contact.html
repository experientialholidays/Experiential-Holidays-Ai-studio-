<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback & Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="config.js"></script>
    <style>
        :root { 
            --slate: #4a4542; 
            --accent: #a37c6b; 
            --tag-bg: #f5ede8; 
            --bg-warm: #faf7f4;
            --border-soft: #f0e6e0;
        }
        body { font-family: 'Inter', sans-serif; color: var(--slate); font-size: 15px; background-color: var(--bg-warm); }
        
        .form-card { background: white; border-radius: 20px; border: 1px solid var(--border-soft); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .input-field { display: block; width: 100%; font-size: 14px; padding: 12px 16px; border: 1px solid var(--border-soft); border-radius: 12px; color: var(--slate); background-color: #fafaf9; outline: none; transition: all 0.2s; font-weight: 500; }
        .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--tag-bg); background-color: white; }
        
        .btn-submit { background-color: var(--slate); color: white; padding: 14px 24px; border-radius: 12px; font-weight: 700; font-size: 14px; width: 100%; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.05em; border: none; cursor: pointer; }
        .btn-submit:hover { background-color: #332f2d; transform: translateY(-1px); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body class="min-h-screen pb-12">
    <div id="site-navbar"></div>
    <script src="navbar.js"></script>
    

    <div class="p-4 md:p-8 mt-4 md:mt-8">
        <div class="max-w-xl mx-auto">
            
            <div class="text-center mb-8">
                <h2 class="text-3xl font-black text-stone-800 uppercase tracking-tight mb-3">Feedback & Support</h2>
                <p class="text-stone-500 font-medium leading-relaxed">
                    We recently launched Experiential Holidays and would love to hear from you. Whether you have suggestions, feedback, experiences to share, reviews, or issues to report, we welcome your thoughts and insights.
                </p>
            </div>

            <div class="form-card p-6 md:p-10">
                <form id="feedback-form">
                    
                    <div class="mb-5">
                        <label for="emailInput" class="block text-sm font-bold text-stone-700 uppercase tracking-wide mb-2">Email ID <span class="text-red-500">*</span></label>
                        <input type="email" id="emailInput" class="input-field" placeholder="your@email.com" required>
                    </div>

                    <div class="mb-5">
                        <label class="block text-sm font-bold text-stone-700 uppercase tracking-wide mb-2">Contact Number</label>
                        <div class="flex gap-2">
                            <input type="text" id="countryCode" class="input-field w-1/3 md:w-1/4 text-center" value="+91" placeholder="+Country" required>
                            <input type="tel" id="contactNumber" class="input-field w-2/3 md:w-3/4" placeholder="98765 43210" required>
                        </div>
                    </div>

                    <div class="mb-8">
                        <label for="message" class="block text-sm font-bold text-stone-700 uppercase tracking-wide mb-2">Your Message <span class="text-red-500">*</span></label>
                        <textarea id="message" rows="6" class="input-field resize-y" placeholder="Type your suggestions, reviews, or bug reports here..." required></textarea>
                    </div>

                    <button type="submit" id="submit-btn" class="btn-submit">
                        Send Message
                     </button>

                    <div id="success-msg" class="hidden mt-4 p-4 bg-[#f5ede8] text-[#a37c6b] rounded-xl text-center font-bold text-sm border border-[#e8dad0]">
                        Thank you! Your message has been sent successfully.
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        

        import { initializeApp, getApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = window.GLOBAL_FIREBASE_CONFIG;

        const app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let loggedInEmail = "Anonymous";

        // Auth Logic & Auto-fill Email
        onAuthStateChanged(auth, async (user) => {
            const dropdownProfile = document.getElementById('dropdown-profile');
            const userEmailEl = document.getElementById('user-email');
            const logoutBtn = document.getElementById('logout-btn');
            const loginBtnMenu = document.getElementById('login-btn-menu');
            const adminBadge = document.getElementById('admin-badge');
            const emailInput = document.getElementById('emailInput');

            if (user) {
                loggedInEmail = user.email;
                if (userEmailEl) userEmailEl.innerText = user.email;
                
                // Auto-fill the email form field if it's empty
                if (emailInput && !emailInput.value) {
                    emailInput.value = user.email;
                }

                if (dropdownProfile) dropdownProfile.classList.remove('hidden');
                if (logoutBtn) logoutBtn.classList.remove('hidden');
                if (loginBtnMenu) loginBtnMenu.classList.add('hidden');

                try {
                    const adminSnap = await getDoc(doc(db, "admins", user.email.toLowerCase().trim()));
                    if (adminSnap.exists() && adminBadge) {
                        adminBadge.classList.remove('hidden');
                    }
                } catch (error) {}
            } else {
                loggedInEmail = "Anonymous";
                if (dropdownProfile) dropdownProfile.classList.add('hidden');
                if (adminBadge) adminBadge.classList.add('hidden');
                if (logoutBtn) logoutBtn.classList.add('hidden');
                if (loginBtnMenu) loginBtnMenu.classList.remove('hidden');
            }
        });

        const loginBtnMenuEl = document.getElementById('login-btn-menu');
        if (loginBtnMenuEl) loginBtnMenuEl.onclick = () => signInWithPopup(auth, provider);

        const logoutBtnEl = document.getElementById('logout-btn');
        if (logoutBtnEl) logoutBtnEl.onclick = () => signOut(auth);

        // Form Submission Logic
        document.getElementById('feedback-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submit-btn');
            const successMsg = document.getElementById('success-msg');
            
            // Gather values
            const providedEmail = document.getElementById('emailInput').value.trim();
            const fullContactNumber = document.getElementById('countryCode').value + " " + document.getElementById('contactNumber').value.trim();
            const message = document.getElementById('message').value.trim();

            btn.disabled = true;
            btn.innerText = "Sending...";

            try {
                await addDoc(collection(db, "feedback"), {
                    email: providedEmail,         // Uses the form input
                    loggedInAccount: loggedInEmail, // Stores underlying account email for tracking
                    contactNumber: fullContactNumber,
                    message: message,
                    submittedAt: serverTimestamp()
                });

                document.getElementById('feedback-form').reset();
                successMsg.classList.remove('hidden');
                btn.innerText = "Send Message";
                btn.disabled = false;
                
                // Refill email if they are still logged in
                if (loggedInEmail !== "Anonymous") {
                    document.getElementById('emailInput').value = loggedInEmail;
                }

                setTimeout(() => {
                    successMsg.classList.add('hidden');
                }, 5000);

            } catch (error) {
                console.error("Error submitting feedback:", error);
                alert("Something went wrong. Please try again.");
                btn.innerText = "Send Message";
                btn.disabled = false;
            }
        });
    </script>
<div id="site-footer"></div>
<script src="footer.js"></script>
</body>
</html>
