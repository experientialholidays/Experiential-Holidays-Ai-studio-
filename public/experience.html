    <!-- Floating Share Button Container -->
    <div id="floating-share-container" class="fixed bottom-6 right-6 z-50 hidden">
        <!-- Main FAB -->
        <button onclick="handleFloatingShareClick()" id="shareFab" class="flex items-center justify-center w-14 h-14 bg-[#2b2623] text-white rounded-full shadow-2xl hover:bg-[#1e1a18] hover:scale-110 active:scale-95 transition-all duration-300 cursor-pointer border-2 border-white/20" title="Share Experience">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/>
            </svg>
        </button>

    <!-- Simple Toast Notification -->
    <div id="toast" class="fixed bottom-24 right-6 z-50 transform translate-y-4 opacity-0 transition-all duration-300 bg-stone-800 text-white text-sm px-4 py-2.5 rounded-xl shadow-lg pointer-events-none">
        Copied to clipboard!
    </div>

    <script>
        const firebaseConfig = window.GLOBAL_FIREBASE_CONFIG;
        // Initialize Firebase SDK
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        try {
            db.settings({ experimentalAutoDetectLongPolling: true });
        } catch(e) {
            // Settings already initialized
        }
        const urlParams = new URLSearchParams(window.location.search);
        let experienceId = urlParams.get('id');
        if (!experienceId) {
            const match = window.location.pathname.match(/\/experience\/([^\/]+)/);
            if (match) {
                experienceId = match[1];
            }
        }

        let allData = [];
        let currentMedia = [];
        let currentMediaIndex = 0;
        let activeDetailMedia = 0;

        // Floating Share Button Logic
        function initShareButton(exp) {
            const container = document.getElementById('floating-share-container');
            if (container) {
                container.classList.remove('hidden');
            }

            const nativeShareBtn = document.getElementById('nativeShareBtn');
            if (navigator.share) {
                if (nativeShareBtn) nativeShareBtn.classList.remove('hidden');
            }

            // Set up sharing URLs and content
            const shareUrl = `${window.location.origin}/experience/${exp.slug || ''}`;
            
            let locString = `${exp.City || ''}${(exp.City && exp.State) ? ', ' : ''}${exp.State || ''}`;
            locString = locString ? locString + ', India' : 'India';
            let dateString = exp.FlexibleDates ? "Flexible Dates (check description for dates)" : `${exp.StartDisplay || exp.Start} ${exp.EndDisplay ? ' - ' + exp.EndDisplay : ''}`;
            
            window.currentExperienceForShare = exp;
            window.currentExperienceShareUrl = shareUrl;
        }

        window.handleFloatingShareClick = async function() {
            const exp = window.currentExperienceForShare;
            if (!exp) return;
            let locString = `${exp.City || ''}${(exp.City && exp.State) ? ', ' : ''}${exp.State || ''}`;
            locString = locString ? locString + ', India' : 'India';
            const shareUrl = window.currentExperienceShareUrl || window.location.href;
            
            // TRACK SHARE CLICK
            db.collection('retreats').doc(exp.id).update({
                shares: firebase.firestore.FieldValue.increment(1)
            }).catch(err => console.log("Share count update bypassed"));
            if(typeof gtag === 'function'){
                gtag('event', 'click_share', { experience_id: exp.id, experience_name: exp.Name });
            }

            const shareData = {
                title: exp.Name,
                text: `✨ ${exp.Name} ✨\n\n📍 ${locString}\n📅 ${exp.FlexibleDates ? 'Flexible Dates (check description for dates)' : (exp.StartDisplay || exp.Start)}\n\nCheck out the details here: `,
                url: shareUrl
            };

            // If system sharing is supported, open the native share sheet
            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                } catch (err) {
                    // Try text-only fallback without the url property if it fails
                    const textOnlyData = {
                        title: exp.Name,
                        text: `✨ ${exp.Name} ✨\n\n📍 ${locString}\n📅 ${exp.FlexibleDates ? 'Flexible Dates (check description for dates)' : (exp.StartDisplay || exp.Start)}\n\nCheck out the details here:\n${shareUrl}`
                    };
                    try {
                        await navigator.share(textOnlyData);
                    } catch (e) {
                        console.log('User cancelled or sharing error:', err);
                    }
                }
            } else {
                // Desktop or browsers without system native sharing fallback to Copy Link
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(shareUrl).then(() => {
                        showToast("Link copied to clipboard! Share it anywhere.");
                    }).catch(err => {
                        fallbackCopyText(shareUrl, "Link copied to clipboard! Share it anywhere.");
                    });
                } else {
                    fallbackCopyText(shareUrl, "Link copied to clipboard! Share it anywhere.");
                }
            }
        };

        function fallbackCopyText(text, toastMsg) {
            const el = document.createElement('textarea');
            el.value = text;
            el.setAttribute('readonly', '');
            el.style.position = 'absolute';
            el.style.left = '-9999px';
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast(toastMsg);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.innerText = msg;
            toast.classList.remove('translate-y-4', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-4', 'opacity-0');
            }, 3000);
        }

        function formatDisplayDate(dateStr) {
            if (!dateStr || typeof dateStr !== 'string') return "";
            try {
                const parts = dateStr.split('-');
                if(parts.length !== 3) return dateStr;
                const dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
                if (isNaN(dateObj.getTime())) return dateStr;
                
                const day = dateObj.getDate();
                const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                return `${day} ${months[dateObj.getMonth()]} ${dateObj.getFullYear()}`;
            } catch (e) {
                return dateStr;
            }
        }

        if (!experienceId) {
            document.body.innerHTML = `
                <div style="padding:40px;text-align:center;">
                    <h1>Experience not found</h1>
                </div>
            `;
        } else {
            // Query only by slug as all experiences now have title slugs
            db.collection('retreats').where('slug', '==', experienceId).limit(1).get().then((querySnapshot) => {
                if (!querySnapshot.empty) {
                    return querySnapshot.docs[0];
                } else {
                    return null;
                }
            }).then((doc) => {
                if (!doc || !doc.exists) {
                    const loading = document.getElementById('loading-state');
                    if (loading) {
                        loading.innerHTML = `
                            <div class="py-12 text-center text-stone-500 max-w-md mx-auto px-4">
                                <h1 class="text-2xl font-black text-stone-800 mb-2">Experience Not Found</h1>
                                <p class="text-sm">We couldn't find the requested experience. It might have been removed or the link is invalid.</p>
                                <a href="/" class="inline-block mt-6 px-5 py-2.5 bg-[#a37c6b] text-white rounded-xl text-sm font-bold shadow hover:bg-[#8e6b5c] transition">Go Back Home</a>
                            </div>
                        `;
                    }
                    return;
                }

                const r = doc.data();
                
                // Rewrite URL to beautiful slug URL
                if (r.slug && r.slug.trim() !== '' && r.slug !== 'undefined') {
                    const expectedPath = `/experience/${r.slug}`;
                    if (window.location.pathname !== expectedPath && !window.location.pathname.endsWith(expectedPath)) {
                        window.history.replaceState(null, '', expectedPath);
                    }
                }

                let media = Array.isArray(r.fileUrls) ? [...r.fileUrls] : [];
                let videos = Array.isArray(r.videoLinks) ? [...r.videoLinks] : [];
                media = media.concat(videos);

                const experience = {
                    id: doc.id,
                    slug: r.slug || '',
                    Name: r.retreatName || 'Untitled',
                    Categories: Array.isArray(r.categories) ? r.categories : [],
                    SubCategories: Array.isArray(r.subCategories) ? r.subCategories : [],
                    Hashtags: Array.isArray(r.hashtags) ? r.hashtags : [],
                    State: r.state || '',
                    City: r.city || '',
                    Start: r.startDate || '',
                    StartDisplay: formatDisplayDate(r.startDate || ''),
                    StartTime: r.startTime || '',
                    End: r.endDate || '',
                    EndDisplay: formatDisplayDate(r.endDate || ''),
                    EndTime: r.endTime || '',
                    Description: r.description || '',
                    Cost: r.contribution || '',
                    Inclusions: r.inclusionsExclusions || '',
                    Org: r.orgInfo || '',
                    CName: r.contactName || '',
                    CEmail: r.orgContactEmail || '',
                    CPhone: r.contactWhatsApp || '',
                    CNum: r.contactNumber || '',
                    ExternalLinks: Array.isArray(r.externalLinks) ? r.externalLinks : [],
                    mediaPriority: r.mediaPriority || 'youtube_first',
                    moreDetailsLink: r.moreDetailsLink || '',
                    MediaArray: media,
                    timestamp: r.timestamp || Date.now(),
                    lastUpdated: r.lastUpdated || null,
                    FlexibleDates: !!r.flexibleDates
                };

                renderExperience(experience);
                initShareButton(experience);
            }).catch((error) => {
                console.error("Firestore Loading Error:", error);
                const loading = document.getElementById('loading-state');
                if (loading) {
                    loading.innerHTML = `
                        <div class="py-12 text-center text-red-600 px-4 max-w-md mx-auto">
                            <h1 class="text-2xl font-black mb-2">Error Loading Experience</h1>
                            <p class="text-sm text-stone-500">${error.message || error}</p>
                            <button onclick="window.location.reload()" class="inline-block mt-6 px-5 py-2.5 bg-[#a37c6b] text-white rounded-xl text-sm font-bold shadow hover:bg-[#8e6b5c] transition">Retry</button>
                        </div>
                    `;
                }
            });
        }

        function getYouTubeId(url) {
            if (!url || typeof url !== 'string') return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|\/shorts\/)([^#\&\?]*).*/;
            const match = url.trim().match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function getInstagramId(url) {
            if (!url || typeof url !== 'string') return null;
            const match = url.trim().match(/(?:instagram\.com|instagr\.am)\/(?:reel|reels|p|tv|share\/p|share\/reel)\/([a-zA-Z0-9_-]+)/i);
            return match ? match[1] : null;
        }

        function isPdf(url) {
            if (!url || typeof url !== 'string') return false;
            return url.toLowerCase().includes('.pdf');
        }

        function isImage(url) {
            if (!url || typeof url !== 'string') return false;
            const cleanUrl = url.split('?')[0].toLowerCase();
            return (
                cleanUrl.endsWith('.jpg') ||
                cleanUrl.endsWith('.jpeg') ||
                cleanUrl.endsWith('.png') ||
                cleanUrl.endsWith('.gif') ||
                cleanUrl.endsWith('.webp')
            );
        }

        function getMediaType(url) {
            if (isPdf(url)) return 'pdf';
            if (getYouTubeId(url)) return 'youtube';
            if (getInstagramId(url)) return 'instagram';
            if (isImage(url)) return 'image';
            return 'unknown';
        }

        function hasValidPhone(phone) {
            if (!phone) return false;
            const digits = phone.replace(/\D/g, '');
            return digits.length >= 6;
        }

        function renderMainMedia(index) {
            if (!currentMedia || !currentMedia.length) return;
            activeDetailMedia = index;
            const url = currentMedia[index];
            const ytId = getYouTubeId(url);
            const instaId = getInstagramId(url);
            const pdfFile = isPdf(url);
            let html = '';

            if (ytId) {
                html = `
                <div class="carousel-item">
                    <iframe class="youtube-frame" src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe>
                </div>`;
            } else if (isImage(url)) {
                html = `
                <div class="carousel-item" onclick="openLightbox(${index})">
                    <img src="${url}" class="carousel-image" loading="lazy">
                </div>`;
            } else if (pdfFile) {
                html = `
                <div class="carousel-item">
                    <iframe class="pdf-frame" src="https://drive.google.com/viewerng/viewer?embedded=true&url=${encodeURIComponent(url)}"></iframe>
                </div>`;
            } else if (instaId) {
                html = `
                <div class="carousel-item instagram-wrap">
                    <iframe class="instagram-frame" src="https://www.instagram.com/p/${instaId}/embed/" loading="lazy" frameborder="0" scrolling="no" allowtransparency="true"></iframe> 
                </div>`;
            }

            document.getElementById('modal-carousel-main').innerHTML = html;
            document.querySelectorAll('.carousel-thumb').forEach((el, i) => {
                if(i === index) el.classList.add('active');
                else el.classList.remove('active');
            });
        }
        window.renderMainMedia = renderMainMedia;

        function renderExperience(i) { 
            const loading = document.getElementById('loading-state');
            if (loading) loading.remove();

            document.title = `${i.Name} | Experiential Holidays`;
            const canonical = document.querySelector("link[rel='canonical']");
            if(canonical) canonical.href = window.location.href;

            const metaDesc = document.querySelector('meta[name="description"]');
            if(metaDesc) metaDesc.setAttribute('content', (i.Description || '').substring(0,160));

            const ogTitle = document.querySelector('meta[property="og:title"]');
            if(ogTitle) ogTitle.setAttribute('content', i.Name);

            // 1. Google Analytics: Track Experience View
            if(typeof gtag === 'function'){
                gtag('event', 'view_experience', { 
                    experience_id: i.id,
                    experience_name: i.Name,
                    host_name: i.Org || 'Unknown'
                });
            }

            // 2. Database: Track Unique Page View (Once per session)
            let hasViewed = false;
            try {
                hasViewed = sessionStorage.getItem('viewed_' + i.id);
            } catch(e) { }

            if (!hasViewed) {
                db.collection('retreats').doc(i.id).update({
                    views: firebase.firestore.FieldValue.increment(1)
                }).catch(err => console.log("View count update bypassed (check rules)"));
                try {
                    sessionStorage.setItem('viewed_' + i.id, 'true');
                } catch(e) { }
            }
            
            if(!i) return;
            
            let media = [...i.MediaArray];
            let mediaPriority = i.mediaPriority || 'youtube_first';
            let priorityMap = { youtube: 1, instagram: 2, image: 3, pdf: 4, unknown: 5 };
            if (mediaPriority === 'image_first') {
                priorityMap = { image: 1, instagram: 2, youtube: 3, pdf: 4, unknown: 5 };
            } else if (mediaPriority === 'instagram_first') {
                priorityMap = { instagram: 1, image: 2, youtube: 3, pdf: 4, unknown: 5 };
            }
            media.sort((a, b) => (priorityMap[getMediaType(a)] || 99) - (priorityMap[getMediaType(b)] || 99));

            currentMedia = media;

            let locString = `${i.City || ''}${(i.City && i.State) ? ', ' : ''}${i.State || ''}`;
            if (locString) {
                locString += ', India';
            } else {
                locString = 'India';
            }
            let dateString = `${i.StartDisplay || i.Start} ${i.EndDisplay ? ' - ' + i.EndDisplay : ''}`;
            
            let timestampHtml = '';
            const finalTime = i.lastUpdated || i.timestamp;
            if (finalTime) {
                const dateObj = new Date(finalTime);
                const dDate = `${dateObj.getDate()} ${dateObj.toLocaleString('default', {month: 'short'})} ${dateObj.getFullYear()}`;
                const dTime = `${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}`;
                
                const labelStr = i.lastUpdated ? 'Edited On:' : 'Submitted On:';

                timestampHtml = `
                <div class="mt-8 text-right text-[10px] text-stone-400 font-medium">
                    <div class="uppercase tracking-wider">${labelStr}</div>
                    <div>${dDate}, ${dTime}</div>
                </div>`;
            }

            // 1. TOP HTML
            let topHtml = ``;
            if(i.SubCategories && i.SubCategories.length > 0) {
                topHtml += `
                <div class="mb-3 flex flex-row flex-wrap gap-2 pr-12">
                    ${i.SubCategories.map(c => `
                        <div>
                            <span class="cat-badge cursor-pointer hover:bg-[#ebdcd4] transition inline-block text-xs font-bold bg-[#f5ede8] text-[#a37c6b] px-3 py-1.5 rounded-full border border-[#e8dad0]" 
                                 onclick="window.location.href='/?category=${encodeURIComponent(c)}'">
                                ${c}
                             </span>
                        </div>`).join('')}
                </div>`;
            }
            if(i.Hashtags && i.Hashtags.length > 0) {
                topHtml += `
                <div class="mb-4 pr-12">
                    <p class="text-xl font-bold text-stone-500 mb-2">
                        ${i.Hashtags.map(tag => `
                            <span class="cursor-pointer hover:text-stone-700 transition"
                                  onclick="window.location.href='/?tag=${encodeURIComponent(tag.replace(/^#/, ''))}'">
                                ${tag}
                            </span>`).join(' ')}
                    </p>
                </div>`;
            }
            if(i.Name) topHtml += `<h2 class="text-3xl font-black text-stone-800 leading-tight mb-2">${i.Name}</h2>`;
            if(locString) topHtml += `<p class="text-xl font-bold text-stone-500 mb-2">📍 ${locString}</p>`;

            if(i.FlexibleDates || i.Start || i.End) {
                topHtml += `
                <div class="bg-white p-5 rounded-2xl border border-slate-100 mt-4 mb-6" style="border-color: var(--border-soft);">
                    <p class="text-xs font-bold text-stone-400 uppercase mb-1 tracking-wider">Schedule</p>
                    ${i.FlexibleDates ? `<p class="font-bold text-[#a37c6b] text-base flex items-center gap-1.5">📅 Flexible Dates (check description for dates)</p>` : ''}
                    ${!i.FlexibleDates && i.Start ? `<p class="font-bold text-stone-700">Starts: ${i.StartDisplay || i.Start} ${i.StartTime ? 'at ' + i.StartTime : ''}</p>` : ''}
                    ${!i.FlexibleDates && i.End ? `<p class="font-bold text-stone-700">Ends: ${i.EndDisplay || i.End} ${i.EndTime ? 'at ' + i.EndTime : ''}</p>` : ''}
                </div>`;
            }
            document.getElementById('modal-top-info').innerHTML = topHtml;

            // 2. CAROUSEL
            activeDetailMedia = 0;
            document.getElementById('modal-carousel').innerHTML = `
                <div id="modal-carousel-main" class="carousel-main"></div>
                <div class="carousel-thumbs">
                ${media.map((url, index) => {
                    const ytId = getYouTubeId(url);
                    const instaId = getInstagramId(url);
                    const pdfFile = isPdf(url);

                    if (ytId) {
                        return `
                        <div class="carousel-thumb relative" onclick="renderMainMedia(${index})">
                            <img src="https://img.youtube.com/vi/${ytId}/mqdefault.jpg">
                            <div class="absolute bottom-1 right-1 bg-red-600 text-white text-[10px] px-1 rounded">YT</div>
                        </div>`;
                    } else if (isImage(url)) {
                        return `
                        <div class="carousel-thumb" onclick="renderMainMedia(${index})">
                            <img src="${url}">
                        </div>`;
                    } else if (instaId) {
                        return `
                        <div class="carousel-thumb relative overflow-hidden bg-gradient-to-tr from-purple-700 via-rose-500 to-amber-500 text-white flex flex-col items-center justify-center p-1" onclick="renderMainMedia(${index})" title="Instagram Post">
                            <svg class="w-7 h-7 drop-shadow-sm" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                            <span class="text-[9px] font-black tracking-wider uppercase mt-0.5">Instagram</span>
                        </div>`;
                    } else if (pdfFile) {
                        return `
                        <div class="carousel-thumb flex flex-col bg-stone-100 text-stone-700" onclick="renderMainMedia(${index})">
                            <div class="text-3xl">📄</div>
                            <div class="text-[10px] font-bold mt-1">PDF</div>
                        </div>`;
                    }
                    return '';
                }).join('')}
                </div>
            `;
            renderMainMedia(0);

            // 3. BOTTOM HTML
            let bottomHtml = ``;
            if(i.Description) {
                const generalNote = `\n\n* For complete details or more information, please use the links provided below.`;
                const combinedDesc = i.Description.trim() + generalNote;
                bottomHtml += `
                    <div class="section-label">Overview</div>
                    <p class="whitespace-pre-line text-stone-600 leading-relaxed mb-6">${combinedDesc}</p>`;
            }

            if(i.Cost || i.Inclusions) {
                bottomHtml += `<div class="section-label">Contribution</div>`;
                if(i.Cost) bottomHtml += `<p class="font-bold text-stone-800 text-lg whitespace-pre-wrap">${i.Cost}</p>`;
                if(i.Inclusions) bottomHtml += `<p class="text-stone-500 italic text-base mt-2 whitespace-pre-wrap">${i.Inclusions}</p>`;
            }

            if(i.Org || i.CName || i.CEmail || i.CPhone || i.CNum) {
                bottomHtml += `<div class="section-label">Host Information</div>`;
                if(i.Org) bottomHtml += `<p class="font-bold text-stone-800 whitespace-pre-wrap">${i.Org}</p>`;
    
                let contactDetails = [
                    i.CName, 
                    i.CEmail, 
                    hasValidPhone(i.CPhone) ? `WA: ${i.CPhone}` : '',
                    hasValidPhone(i.CNum) ? `Ph: ${i.CNum}` : ''
                ].filter(detail => detail).join(' | ');
    
                if(contactDetails) {
                    bottomHtml += `<p class="text-stone-500 text-base mt-1">${contactDetails}</p>`;
                }
            }

            if(i.ExternalLinks && i.ExternalLinks.length > 0) {
                bottomHtml += `
                    <div class="section-label">Related Links</div>
                    <div class="flex flex-col gap-2 mb-6">
                        ${i.ExternalLinks.map(l => `<a href="${l}" target="_blank" class="text-blue-600 underline hover:text-blue-800 truncate ext-link-btn" data-url="${l}">${l}</a>`).join('')}
                    </div>`;
            }

            if(i.moreDetailsLink) {
                let formattedDetailsUrl = i.moreDetailsLink.trim();
                if (!/^https?:\/\//i.test(formattedDetailsUrl)) {
                    formattedDetailsUrl = 'https://' + formattedDetailsUrl;
                }
                bottomHtml += `
                    <div class="mt-8 mb-3">
                        <a href="${formattedDetailsUrl}" target="_blank" rel="noopener noreferrer" class="btn-more-details block w-full text-center font-bold py-3.5 px-6 rounded-2xl transition shadow-md hover:opacity-90 flex items-center justify-center gap-2 text-white text-base" style="background-color: var(--accent);" data-url="${formattedDetailsUrl}">
                            <span>🌐</span>
                            <span>Check Details</span>
                        </a>
                    </div>`;
            }

            if(hasValidPhone(i.CPhone)) {
                let waMessage = `I came across the *${i.Name}* experience to be held on ${dateString} at ${locString} on experientialholidays.info.\n\nCould you please share more details about the event?`;
                let encodedMessage = encodeURIComponent(waMessage);
                let waTopMargin = i.moreDetailsLink ? 'mt-3' : 'mt-8';
                bottomHtml += `
                    <div class="${waTopMargin}">
                        <a href="https://wa.me/${i.CPhone}?text=${encodedMessage}" target="_blank" class="btn-wa">
                            <svg class="w-6 h-6 fill-current inline-block" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                            <span>Inquire on WhatsApp</span>
                        </a>
                    </div>`;
            }

            bottomHtml += timestampHtml;

            document.getElementById('modal-content').innerHTML = bottomHtml;

            setTimeout(() => {
                // WhatsApp Button Tracking (DB + GA4 + Activity Tracker)
                const waBtn = document.querySelector('.btn-wa');
                if(waBtn) {
                    waBtn.addEventListener('click', () => {
                        // DB Tracking
                        db.collection('retreats').doc(i.id).update({
                            whatsappClicks: firebase.firestore.FieldValue.increment(1)
                        }).catch(err => console.log("Click count update bypassed"));

                        if (typeof trackUserActionToFirestore === 'function') {
                            trackUserActionToFirestore({
                                eventType: 'whatsapp_click',
                                experienceId: i.id,
                                experienceName: i.Name,
                                targetUrl: waBtn.href || '',
                                hostName: i.Org || 'Unknown'
                            });
                        }

                        // GA4 Tracking
                        if(typeof gtag === 'function'){
                            gtag('event', 'click_whatsapp', {
                                experience_id: i.id,
                                experience_name: i.Name,
                                host_name: i.Org || 'Unknown'
                            });
                        }
                    });
                }

                // External Links Tracking (DB + GA4 + Activity Tracker)
                const extLinks = document.querySelectorAll('.ext-link-btn, .btn-more-details');
                extLinks.forEach(link => {
                    link.addEventListener('click', (e) => {
                        const clickedUrl = e.currentTarget.getAttribute('data-url') || e.currentTarget.href;
                        const isMoreDetails = e.currentTarget.classList.contains('btn-more-details');
                        
                        // NEW: Increment External Link Clicks in Database
                        db.collection('retreats').doc(i.id).update({
                            externalLinkClicks: firebase.firestore.FieldValue.increment(1)
                        }).catch(err => console.log("External link count update bypassed"));

                        if (typeof trackUserActionToFirestore === 'function') {
                            trackUserActionToFirestore({
                                eventType: isMoreDetails ? 'more_details_click' : 'external_link_click',
                                experienceId: i.id,
                                experienceName: i.Name,
                                targetUrl: clickedUrl,
                                hostName: i.Org || 'Unknown'
                            });
                        }

                        // GA4 Event
                        if(typeof gtag === 'function'){
                            gtag('event', 'click_external_link', {
                                experience_id: i.id,
                                experience_name: i.Name,
                                host_name: i.Org || 'Unknown',
                                link_url: clickedUrl
                            });
                        }
                    });
                });
            }, 100);
        }

        // Lightbox Functions
        window.addEventListener('popstate', function() {
            if (document.getElementById('lightbox').style.display === 'flex') {
                closeLightbox(true);
            }
        });

        function openLightbox(index) {
            currentMediaIndex = index;
            const lightbox = document.getElementById('lightbox');
            if (!lightbox) return;

            document.body.appendChild(lightbox);
            lightbox.style.display = 'flex';
            updateLightbox();
            history.pushState({ lightboxOpen: true }, '', '#lightbox');
        }

        function closeLightbox(isPopState = false) {
            const lightbox = document.getElementById('lightbox');
            if (lightbox) lightbox.style.display = 'none';
            
            const container = document.getElementById('lightbox-content');
            if (container) container.innerHTML = '';
            
            if (!isPopState && window.location.hash === '#lightbox') {
                history.back();
            }
        }

        function changeLightbox(step) {
            if (currentMedia.length === 0) return;
            let newIndex = currentMediaIndex + step;
            
            if (newIndex < 0 || newIndex >= currentMedia.length) {
                return; 
            }
            
            currentMediaIndex = newIndex;
            updateLightbox();
        }

        function updateLightbox() {
            const url = currentMedia[currentMediaIndex];
            const container = document.getElementById('lightbox-content');
            if (!container) return;

            const instaId = getInstagramId(url);
            const ytId = getYouTubeId(url);
            const pdfFile = isPdf(url);

            if (ytId) {
                container.innerHTML = `
                    <iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1" style="width:min(96vw,1200px);height:min(80vh,700px);border-radius:22px;" allow="autoplay; fullscreen" allowfullscreen></iframe>
                `;
            } else if (isImage(url)) {
                container.innerHTML = `<img src="${url}" loading="lazy" alt="Media">`;
            } else if (pdfFile) {
                container.innerHTML = `
                    <iframe src="https://drive.google.com/viewerng/viewer?embedded=true&url=${encodeURIComponent(url)}" style="width:96vw;height:92vh;background:white;border-radius:18px;"></iframe>
                `;
            } else if (instaId) {
                container.innerHTML = `
                    <iframe class="instagram-frame" src="https://www.instagram.com/reel/${instaId}/embed/" scrolling="no" allowtransparency="true"></iframe>
                `;
            }
        }

        // Lightbox Swipe Logic
        let startX = 0;
        let endX = 0;
        const lightboxContainer = document.getElementById('lightbox');

        lightboxContainer.addEventListener('touchstart', e => {
            startX = e.changedTouches[0].screenX;
        }, { passive: true });

        lightboxContainer.addEventListener('touchend', e => {
            endX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        lightboxContainer.addEventListener('mousedown', e => {
            startX = e.screenX;
        });

        lightboxContainer.addEventListener('mouseup', e => {
            endX = e.screenX;
            handleSwipe();
        });

        function handleSwipe() {
            const threshold = 50; 
            const isIframe = document.querySelector('#lightbox-content iframe');
            if (isIframe) return; 

            if (endX < startX - threshold) changeLightbox(1); 
            if (endX > startX + threshold) changeLightbox(-1);
        }
    </script>

    <script type="module">
        import { initializeApp, getApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = window.GLOBAL_FIREBASE_CONFIG;

        const app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const menuBtn = document.getElementById('mobile-menu-btn');
        const dropdownMenu = document.getElementById('dropdown-menu');

        

        onAuthStateChanged(auth, (user) => {
            const dropdownProfile = document.getElementById('dropdown-profile');
            const userEmailEl = document.getElementById('user-email');
            const logoutBtn = document.getElementById('logout-btn');
            const loginBtnMenu = document.getElementById('login-btn-menu');

            if (user) {
                if (userEmailEl) userEmailEl.innerText = user.email.split('@')[0];
                if (dropdownProfile) dropdownProfile.classList.remove('hidden');
                if (logoutBtn) logoutBtn.classList.remove('hidden');
                if (loginBtnMenu) loginBtnMenu.classList.add('hidden');
            } else {
                if (dropdownProfile) dropdownProfile.classList.add('hidden');
                if (logoutBtn) logoutBtn.classList.add('hidden');
                if (loginBtnMenu) loginBtnMenu.classList.remove('hidden');
            }
        });

        const loginBtnMenuEl = document.getElementById('login-btn-menu');
        if (loginBtnMenuEl) loginBtnMenuEl.onclick = () => signInWithPopup(auth, provider);

        const logoutBtnEl = document.getElementById('logout-btn');
        if (logoutBtnEl) logoutBtnEl.onclick = () => signOut(auth);
    </script>
<div id="site-footer"></div>
<script src="/footer.js"></script>
</body>
</html>
